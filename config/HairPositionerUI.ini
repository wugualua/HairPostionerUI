[General]
; Skyrim language names: english, korean, japanese, french, etc.
; Missing translations fall back to built-in English. Restart after changing.
Language=english

[Hotkey]
; Keyboard scan code: F3 = 61. Set 0 to disable.
; Can also be changed in the HairPositioner UI settings.
Key=61

[Editing]
; 0 = small, 1 = medium, 2 = large
Precision=1
